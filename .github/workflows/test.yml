name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The suite redirects HOME/USERPROFILE and GIT_CONFIG_GLOBAL into temp
      # dirs. If a test ever escapes that isolation and writes into the repo,
      # this is what catches it.
      - run: git diff --exit-code
